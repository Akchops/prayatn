<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(d){d.classList.add('js');d.dataset.features='{{features}}';try{if({{opening}}&&!matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('opening')}catch(e){}try{if(/pageCloth/.test(d.dataset.features)){var im=sessionStorage.getItem('pc-img');sessionStorage.removeItem('pc-img');if(im&&!matchMedia('(prefers-reduced-motion: reduce)').matches){d.classList.remove('opening');d.classList.add('pc-in');window.__pcImg=im;var st=document.createElement('style');st.textContent='html.pc-in::after{background:#1E2440 url('+im+') 0 0/100% 100% no-repeat!important}';document.head.appendChild(st)}}}catch(e){}try{if(/pageWeave/.test(d.dataset.features)&&sessionStorage.getItem('pw')){sessionStorage.removeItem('pw');if(!d.classList.contains('opening')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('pw-in')}}catch(e){}})(document.documentElement)</script>
    <meta name="theme-color" content="#1E2440">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/src/styles/main.css">
    <script type="module" src="/src/main.js"></script>
