<!doctype html>
<html lang="en">
  <head>
    <!--@head-->
    <title>Gallery · Prayatn</title>
    <meta name="description" content="Photographs of Prayatn's work: healthcare, education, women development, and events.">
  </head>
  <body class="page-inner page-prog">
    <!--@header-->
    <main id="main">
      <header class="band woven" data-band data-intro="deal" style="{{weave gallery-86}}">
        <div class="band__inner">
          <p class="band__kicker">Gallery</p>
          <h1 class="band__title">Our work, in pictures</h1>
          <p class="band__lede">Taken at the health centre, the school, the Mahila Panchayat, the Legal Help Desk, and at our events.</p>
        </div>
        {{bandimg gallery-86}}
      </header>
      <div class="gfilter" data-gfilter hidden>
        <button type="button" aria-pressed="true" data-f="all">All</button>
        <button type="button" aria-pressed="false" data-f="health">Healthcare</button>
        <button type="button" aria-pressed="false" data-f="school">Education</button>
        <button type="button" aria-pressed="false" data-f="women">Women development</button>
        <button type="button" aria-pressed="false" data-f="events">Events</button>
      </div>
      <section class="loom" data-loom aria-labelledby="loom-h">
        <h2 id="loom-h" class="visually-hidden">The Loom: every photograph, woven together</h2>
        <div class="loom__stage" tabindex="0" aria-label="A tapestry of all our photographs. Drag, or use the arrow keys, to explore; select a photo to enlarge it. A list of every photo follows.">
          <p class="loom__hint" aria-hidden="true"><span>Drag to explore</span><span>Tap a photo to open it</span></p>
        </div>
        <button type="button" class="loom__list-toggle" data-list-toggle aria-expanded="false">Show every photo as a list</button>
      </section>
      <div class="pgallery pgallery--all" id="photo-list">
        {{gallery all}}
      </div>
      <dialog class="lightbox" data-lightbox aria-label="Photo">
        <button type="button" class="lightbox__close" data-close aria-label="Close">×</button>
        <img alt="">
        <p class="lightbox__cap"></p>
      </dialog>
    </main>
    <!--@footer-->
  </body>
</html>
