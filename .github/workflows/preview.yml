# Builds the site and publishes it to GitHub Pages. It deploys only once
# Pages is switched on: Settings → Pages → Source: "GitHub Actions". Until
# then the build still runs and the deploy is skipped.
#
# Where it is published decides how it is built:
# - no custom domain: a PRE-LAUNCH PREVIEW at https://<owner>.github.io/prayatn/,
#   marked noindex with a preview bar;
# - custom domain set in Settings → Pages (prayatnonline.org): the real site,
#   served from the domain's root, open to Google, no preview bar.
name: Preview

on:
  push:
    branches: [claude/upbeat-curie-vtbltb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      # Pages' address: https://<owner>.github.io/prayatn, or the custom domain.
      - id: where
        env:
          URL: ${{ steps.pages.outputs.base_url }}
          HOST: ${{ steps.pages.outputs.host }}
          PATH_: ${{ steps.pages.outputs.base_path }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$HOST" ] && [ "${HOST%github.io}" = "$HOST" ]; then
            echo "base=${PATH_}/" >> "$GITHUB_OUTPUT"; echo "preview=" >> "$GITHUB_OUTPUT"
            URL="https://$HOST$PATH_" # Pages says http:// until HTTPS is switched on
          else
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"; echo "preview=1" >> "$GITHUB_OUTPUT"
            URL="${URL:-https://$OWNER.github.io/$REPO}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Building for $URL"
      - run: npm run build
        env:
          BASE: ${{ steps.where.outputs.base }}
          PREVIEW: ${{ steps.where.outputs.preview }}
          SITE_URL: ${{ steps.where.outputs.url }}
      - run: node scripts/first-load-budget.mjs dist/
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
